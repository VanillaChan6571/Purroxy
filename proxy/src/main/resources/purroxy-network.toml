# Enable discovery, then copy purroxy-pairing/purroxy.challenge into each Nekopur server directory.
# The same challenge enrolls any number of backends and stays valid until an administrator runs
# /purroxy pairing rotate. Use /purroxy pairing revoke <server> to drop one backend's credential.
format-version = 1
fallback = ["hub"]

# Client protocols allowed to take the seamless, loading-screen-free path in addition to the
# qualified 26.2 (776). Opt-in per protocol, and only after that family has been soaked: a
# listed protocol is one you have qualified, not one this proxy vouches for. Empty by default.
# seamless-canary-protocols = [775]

# Retains one player's minecraft:worldgen/biome payload so a configuration mismatch can be
# explained rather than only reported. One account, one registry, dropped when replaced or on
# disconnect. Leave unset unless you are actively investigating a canary protocol.
# seamless-capture-player = "00000000-0000-0000-0000-000000000000"

# Hold a player in the proxy for this many seconds when no backend will take them, instead of
# dropping them to the multiplayer screen. Their last world stays on screen, frozen, while the
# proxy answers keep-alives and retries every server in the group each second. On expiry they
# are disconnected with the reason they would have received immediately. 0 disables the hold.
limbo-hold-seconds = 60

# How many held players may be sent at a returning backend each second. A hub that has just
# come back would be knocked straight over again if everyone waiting for it arrived at once,
# so the queue drains longest-wait-first at this rate.
limbo-releases-per-second = 2
# Holders of purroxy.limbo.bypass skip that queue entirely and are not counted against the
# rate, so whoever can end an outage is never stuck behind it.





[forced-hosts]
# "play.example.com" = ["hub"]

[discovery]
enabled = false
authentication = "pairing"
# Control handshakes share the Minecraft listener (default 25565).
# Advanced legacy mode: authentication = "certificates" and configure these paths.
# certificate-file = "purroxy.crt"
# private-key-file = "purroxy.key"
# backend-ca-file = "backends-ca.crt"

[groups.hub]
handoff-mode = "off" # Opt in with normal or seamless-preferred; required refuses unqualified continuity.
# Backends kept READY in every region this group occupies, so a player routed to a region never
# waits for a cold start. The last ready backend in a region is never slept, so this only matters
# for a region that is already fully asleep. Set 0 to wake purely on demand.
min-ready-per-region = 1


# One identity per backend. Obtain the SHA-256 fingerprint from its certificate.
# Membership comes from the authenticated resume, not a manually maintained member list.
[backend-identities]
# [backend-identities.hub-1]
# certificate-sha256 = "REPLACE_WITH_CERTIFICATE_SHA256"
# host = "10.0.0.11"
# port = 25565
# allowed-game-modes = ["hub"]
